# Places Tracker - Production Docker Compose (exe.dev deployment)
# MongoDB + Spring Boot behind exe.dev HTTPS proxy
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
#
# Requires: .env file with Google Maps API key (and any other secrets)

name: placestracker-prod

services:
  # MongoDB Database
  mongodb:
    image: mongo:8.0
    container_name: placestracker-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-placestracker}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - placestracker_mongodata:/data/db
      - placestracker_mongoconfig:/data/configdb
    networks:
      - placestracker-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_INITDB_DATABASE:-placestracker} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Places Tracker Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: placestracker-app
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Server Configuration - no SSL, exe.dev handles TLS
      SERVER_SSL_ENABLED: "false"
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /placestracker

      # Forward headers from exe.dev reverse proxy
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: x-forwarded-for
      SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER: x-forwarded-proto

      # MongoDB connection (Spring Boot 4.0: spring.mongodb.uri)
      SPRING_MONGODB_URI: mongodb://mongodb:27017/${MONGO_INITDB_DATABASE:-placestracker}

      # Google Maps API Key - from .env file
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      # Logging
      LOGGING_LEVEL_DK_PLACESTRACKER: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB: WARN

      # Java Memory Settings - this compose file is the single source of truth.
      # NOTE: JAVA_OPTS must NOT be set in .env or it shadows this (it was - .env
      # had -Xmx4g, the likely cause of the Jun 25 freeze: 4g heap + mongo on a
      # 7.7g box with no swap -> memory over-commit -> reclaim-thrash livelock,
      # froze the app and SSH with no clean OOM-kill logged).
      # Heap lowered 4g -> 2g (ample for the image/thumbnail workload, leaves
      # room for mongo + OS). Heap dump on OOM + rotating GC log to the /app/logs
      # volume so the next hang leaves post-mortem evidence.
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10m}
    volumes:
      - placestracker_logs:/app/logs
    networks:
      - placestracker-network
    restart: unless-stopped
    # Hard cap so a runaway JVM can't starve the whole VM (incl. SSH) like Jun 25.
    # Sized above -Xmx2g to leave room for metaspace/threads/direct buffers.
    mem_limit: 2.5g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  placestracker_mongodata:
    driver: local
  placestracker_mongoconfig:
    driver: local
  placestracker_logs:
    driver: local

networks:
  placestracker-network:
    driver: bridge
